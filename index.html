<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>picnic?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f1ead6;
    --paper-warm: #ebe3cc;
    --moss: #3d4f33;
    --moss-soft: #6c8459;
    --moss-faint: #a3b596;
    --rule: rgba(61, 79, 51, 0.15);
    --shadow: 0 30px 60px -30px rgba(61, 79, 51, 0.32);
    --berry: #b14a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--paper);
    color: var(--moss);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
    overflow-x: hidden;
  }

  /* warm dappled-light wash */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 18% 12%, rgba(232, 200, 110, 0.18), transparent 50%),
      radial-gradient(ellipse at 85% 88%, rgba(108, 132, 89, 0.14), transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.20 0 0 0 0 0.18 0 0 0 0 0.13 0 0 0 0.045 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: 0.55;
    z-index: 1;
  }

  main {
    position: relative;
    z-index: 2;
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(3rem, 10vh, 6rem) 1.5rem 4rem;
    text-align: center;
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.05rem;
    color: var(--moss-soft);
    letter-spacing: 0.02em;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
  }

  .eyebrow::before,
  .eyebrow::after {
    content: '';
    height: 1px;
    width: 28px;
    background: var(--moss-faint);
    opacity: 0.6;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(2.6rem, 7vw, 4.25rem);
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: var(--moss);
    margin-bottom: 1.25rem;
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
  }

  .lede {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--moss-soft);
    font-size: 1.15rem;
    max-width: 32ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  .pick {
    font-family: 'Manrope', sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: var(--moss-faint);
    margin: clamp(3rem, 7vh, 4.5rem) 0 2rem;
  }

  .dates {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    max-width: 580px;
    margin: 0 auto;
  }

  .date-card {
    position: relative;
    background: var(--paper-warm);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 2.25rem 1.5rem 2rem;
    text-decoration: none;
    color: var(--moss);
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1),
                box-shadow 0.5s cubic-bezier(0.2, 0.7, 0.2, 1),
                background 0.5s ease;
  }

  .date-card::before,
  .date-card::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--moss-faint);
    opacity: 0.4;
  }

  .date-card::before {
    top: 10px;
    left: 10px;
    border-right: none;
    border-bottom: none;
  }

  .date-card::after {
    bottom: 10px;
    right: 10px;
    border-left: none;
    border-top: none;
  }

  .date-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow);
    background: #f3eddb;
  }

  .icon-wrap {
    width: 140px;
    height: 140px;
    margin-bottom: 1.5rem;
    transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .date-card:hover .icon-wrap {
    transform: rotate(-4deg) translateY(-2px);
  }

  .icon-wrap svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* gentle bob */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .icon-wrap svg > g {
    transform-origin: 60px 95px;
    animation: bob 5s ease-in-out infinite;
  }

  .date-card:nth-child(2) .icon-wrap svg > g {
    animation-duration: 6.5s;
    animation-delay: -1.5s;
  }

  .day {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1rem;
    color: var(--moss-soft);
    margin-bottom: 0.35rem;
  }

  .num {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 3.25rem;
    line-height: 1;
    letter-spacing: -0.03em;
    margin-bottom: 0.5rem;
  }

  .month {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.32em;
    color: var(--moss-faint);
  }

  .divider {
    width: 32px;
    height: 1px;
    background: var(--rule);
    margin: 0.9rem auto;
  }

  .add {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 0.92rem;
    color: var(--moss-soft);
    transition: color 0.3s ease;
  }

  .date-card:hover .add {
    color: var(--moss);
  }

  .add svg {
    display: inline-block;
    vertical-align: -2px;
    margin-left: 4px;
    transition: transform 0.4s ease;
  }

  .date-card:hover .add svg {
    transform: translateX(4px);
  }

  footer {
    margin-top: 3.5rem;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--moss-soft);
    font-size: 1.05rem;
    line-height: 1.9;
  }

  footer a {
    color: var(--moss);
    text-decoration: none;
    border-bottom: 1px solid var(--moss-faint);
    padding-bottom: 1px;
    transition: border-color 0.3s ease;
  }

  footer a:hover {
    border-bottom-color: var(--moss);
  }

  .hour {
    font-variant-numeric: oldstyle-nums;
  }

  /* leafy footer flourish */
  .sprig {
    display: block;
    width: 80px;
    margin: 1.75rem auto 0;
    opacity: 0.6;
  }

  /* leaf explosion transition */
  .leaf-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }

  .wash {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: wash-grow 1100ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
    filter: blur(2px);
  }

  @keyframes wash-grow {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    25% { opacity: 0.55; }
    100% { transform: translate(-50%, -50%) scale(80); opacity: 1; }
  }

  .leaf {
    position: absolute;
    width: 22px;
    height: 32px;
    border-radius: 0 100% 0 100%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.2) rotate(var(--start-r));
    opacity: 0;
    animation: leaf-fly 1100ms cubic-bezier(0.2, 0.65, 0.3, 1) forwards;
    box-shadow: 0 2px 6px rgba(61, 79, 51, 0.12);
  }

  /* faint vein on each leaf */
  .leaf::after {
    content: '';
    position: absolute;
    inset: 8% 48% 8% 48%;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 50%;
  }

  @keyframes leaf-fly {
    0% {
      transform: translate(-50%, -50%) scale(0.2) rotate(var(--start-r));
      opacity: 0;
    }
    12% { opacity: 1; }
    100% {
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.6) rotate(var(--end-r));
      opacity: 0.95;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .leaf, .wash { animation: none; }
  }

  @media (max-width: 480px) {
    .dates { grid-template-columns: 1fr; max-width: 320px; }
    .num { font-size: 2.75rem; }
  }
</style>
</head>
<body>

<script>
  (function () {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const palette = {
      basket: {
        wash: '#7a9460',
        leaves: ['#4f6940', '#6c8459', '#7a9460', '#8fa66e', '#c4a85e']
      },
      jam: {
        wash: '#6c8459',
        leaves: ['#4f6940', '#6c8459', '#7a9460', '#8fa66e', '#b14a4f']
      }
    };

    function spawnTransition(card, done) {
      const icon = card.querySelector('.icon-wrap');
      const rect = icon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const colors = palette[card.dataset.leaf] || palette.basket;

      const overlay = document.createElement('div');
      overlay.className = 'leaf-overlay';

      const wash = document.createElement('div');
      wash.className = 'wash';
      wash.style.left = cx + 'px';
      wash.style.top = cy + 'px';
      wash.style.background = colors.wash;
      overlay.appendChild(wash);

      const NUM = 80;
      const maxDim = Math.max(window.innerWidth, window.innerHeight);

      for (let i = 0; i < NUM; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.style.left = cx + 'px';
        leaf.style.top = cy + 'px';
        leaf.style.background = colors.leaves[Math.floor(Math.random() * colors.leaves.length)];

        const angle = Math.random() * Math.PI * 2;
        const distance = 180 + Math.random() * maxDim * 0.9;
        leaf.style.setProperty('--tx', (Math.cos(angle) * distance).toFixed(1) + 'px');
        leaf.style.setProperty('--ty', (Math.sin(angle) * distance).toFixed(1) + 'px');
        leaf.style.setProperty('--start-r', (Math.random() * 360).toFixed(1) + 'deg');
        leaf.style.setProperty('--end-r', (Math.random() * 720 - 360).toFixed(1) + 'deg');
        leaf.style.animationDelay = Math.floor(Math.random() * 220) + 'ms';

        const scale = 0.7 + Math.random() * 1.0;
        leaf.style.width = (22 * scale).toFixed(0) + 'px';
        leaf.style.height = (32 * scale).toFixed(0) + 'px';

        overlay.appendChild(leaf);
      }

      document.body.appendChild(overlay);
      setTimeout(done, 1100);
    }

    document.querySelectorAll('.date-card').forEach(function (card) {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        const url = card.getAttribute('href');
        if (reducedMotion) {
          window.location.href = url;
          return;
        }
        spawnTransition(card, function () {
          window.location.href = url;
        });
      });
    });
  })();
</script>
</body>
</html>
